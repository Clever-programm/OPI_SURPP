[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["i.tsaregorodtsev <tsaregorodtsevigorek@yandex.ru>"]
readme = "README.md"
packages = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
uvicorn = ">=0.41.0,<0.42.0"
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.46,<3.0.0"}
asyncpg = ">=0.31.0,<0.32.0"
python-dotenv = "^1.2.1"
alembic = "^1.18.4"
fastapi = "^0.135.1"
psycopg2 = "^2.9.11"
pydantic-settings = "^2.13.1"

[tool.poetry.group.dev.dependencies]
aiosqlite = "^0.19.0"
pytest = "8.3.0"
black = "^26.3.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.26.0"
coverage = "^7.4.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"