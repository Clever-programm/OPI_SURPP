version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isurpp-backend
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql+asyncpg://isurpp:VPNqLf2oFANjI3o@db:5432/plannerdb
      - DB_SYNC=postgresql+psycopg2://isurpp:VPNqLf2oFANjI3o@db:5432/plannerdb
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
    networks:
      - isurpp-network

  db:
    image: postgres:15-alpine
    container_name: isurpp-postgres
    environment:
      POSTGRES_DB: plannerdb
      POSTGRES_USER: isurpp
      POSTGRES_PASSWORD: VPNqLf2oFANjI3o
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isurpp -d plannerdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - isurpp-network

volumes:
  postgres_data:
    driver: local

networks:
  isurpp-network:
    driver: bridge