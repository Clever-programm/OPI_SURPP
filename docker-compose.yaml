version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - isurpp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: isurpp-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - isurpp-network
    # ports: 
    #   - "3000:3000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isurpp-backend
    env_file:
      - ./backend/.env
    # ports:
    #   - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app
    networks:
      - isurpp-network

  db:
    image: postgres:15-alpine
    container_name: isurpp-postgres
    env_file:
      - ./backend/.env
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - isurpp-network

volumes:
  postgres_data:
    driver: local

networks:
  isurpp-network:
    driver: bridge